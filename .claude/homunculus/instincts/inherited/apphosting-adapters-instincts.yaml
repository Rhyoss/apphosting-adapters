# Apphosting Adapters Workflow Dependency Update Across Multiple Packages

## Action

Follow the dependency-update-across-multiple-packages workflow:
1. Identify outdated dependencies in all package.json files.
2. Update the version numbers in package.json files for each affected package/starter.
3. Regenerate or update corresponding package-lock.json files.
4. Commit all changed package.json and package-lock.json files together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: */package.json, */package-lock.json, packages/*/package.json

